# Local development infrastructure only.
# Application code runs on the host (uv / npm) so that reloads are instant and
# the guest camera can be reached from a phone on the same network.
#
# Host ports are deliberately non-standard to avoid clashing with anything
# already running locally.

name: luma

services:
  postgres:
    # pgvector is needed for face embeddings (CONCEPT.md §8). Installing it now
    # costs nothing and avoids a migration to a different image later.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-luma}
      POSTGRES_USER: ${POSTGRES_USER:-luma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luma}
    ports:
      - "5442:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luma} -d ${POSTGRES_DB:-luma}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. Photographs never pass through Django —
  # the browser uploads directly here via a pre-signed URL (CONCEPT.md, Storage).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9011"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-lumaminio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-lumaminio}
    ports:
      - "9010:9000"   # API
      - "9011:9011"   # console — http://127.0.0.1:9011
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create buckets and set CORS so the browser can PUT directly.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-lumaminio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-lumaminio}
      S3_BUCKET_ORIGINALS: ${S3_BUCKET_ORIGINALS:-luma-originals}
      S3_BUCKET_DERIVATIVES: ${S3_BUCKET_DERIVATIVES:-luma-derivatives}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY;
      mc mb --ignore-existing local/$$S3_BUCKET_ORIGINALS;
      mc mb --ignore-existing local/$$S3_BUCKET_DERIVATIVES;
      mc anonymous set none local/$$S3_BUCKET_ORIGINALS;
      mc anonymous set none local/$$S3_BUCKET_DERIVATIVES;
      echo 'buckets ready';
      "

  # Catches every outbound email. Nothing escapes to a real inbox.
  # UI: http://127.0.0.1:8035
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1035:1025"   # SMTP
      - "8035:8025"   # web UI
    environment:
      MP_MAX_MESSAGES: 500
