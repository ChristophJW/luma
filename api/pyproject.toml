[project]
name = "luma-api"
version = "0.1.0"
description = "Luma API — Django + Django Ninja"
# Pinned to 3.12 rather than ">=3.12". The inference worker will need
# onnxruntime for face lookup (CONCEPT.md §7), and that wheel is historically
# slow to publish for brand-new Python releases. Cheaper to pin now.
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.1,<6",
    "django-ninja>=1.3",
    # Required by pydantic's EmailStr, used on the auth endpoints.
    "email-validator>=2.2",
    "django-cors-headers>=4.6",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.3",
    "python-dotenv>=1.0",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "boto3>=1.35",
    "pillow>=11.0",
    # QR rendering. Server-side so the same source produces the in-app code,
    # the printable signs and the table cards (CHECKLIST.md §6).
    "qrcode>=8.0",
    # Local child-face blurring in the inference worker (apps/faces). Headless
    # so it pulls no GUI/X11 libs on a server. numpy is its own transitive dep
    # but pinned here because the blur task uses it directly.
    # Pinned <5: OpenCV 5 dropped the Caffe importer (readNetFromCaffe) that the
    # Levi & Hassner age net needs. Revisit with an ONNX age model to move to 5.
    "opencv-python-headless>=4.10,<5",
    "numpy>=2.0",
    # pgvector is installed now so the face-lookup migration path exists later.
    # Nothing uses it yet — the feature is off by default (CONCEPT.md §7).
    "pgvector>=0.3",
]

[project.optional-dependencies]
# Only needed where mail is actually delivered through Azure. Local
# development uses Mailpit and does not install this.
azure = [
    "azure-communication-email>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
